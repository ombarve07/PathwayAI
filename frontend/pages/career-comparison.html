<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Comparison - PATHWAY AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/logo-badge.png" alt="PATHWAY AI Logo" class="brand-logo-img">
        <span class="brand-name">PATHWAY <span class="brand-ai-badge">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="student-dashboard.html" class="btn btn-secondary btn-sm">My Dashboard</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div style="text-align: center; margin-bottom: 40px;">
        <span class="label-caps">Objective Trade-Off Analysis</span>
        <h1 class="headline-lg" style="margin-top: 8px;">Compare Career Pathways</h1>
        <p class="body-md" style="margin-top: 8px;">Evaluate entrance exams, educational duration, required skills, and salary expectations side-by-side.</p>
      </div>

      <!-- Comparison Selector -->
      <div class="card" style="margin-bottom: 32px; padding: 24px;">
        <div class="grid-2" style="gap: 20px;">
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Primary Career (Option A)</label>
            <select id="careerASelect" class="form-control" onchange="updateComparison()"></select>
          </div>
          <div class="form-group" style="margin-bottom: 0;">
            <label class="form-label">Comparison Career (Option B)</label>
            <select id="careerBSelect" class="form-control" onchange="updateComparison()"></select>
          </div>
        </div>
      </div>

      <!-- Comparison Table Grid -->
      <div id="comparisonGrid" class="grid-2" style="gap: 24px;">
        <div id="cardA" class="card" style="padding: 32px;"></div>
        <div id="cardB" class="card" style="padding: 32px;"></div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="border:none; padding-top:0;">
        <div>&copy; 2026 PATHWAY AI. All rights reserved.</div>
      </div>
    </div>
  </footer>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let careers = [];

    document.addEventListener("DOMContentLoaded", async () => {
      careers = await API.careers.list();
      const selA = document.getElementById("careerASelect");
      const selB = document.getElementById("careerBSelect");

      selA.innerHTML = careers.map(c => `<option value="${c.id}">${c.title} (${c.category_name})</option>`).join("");
      selB.innerHTML = careers.map(c => `<option value="${c.id}">${c.title} (${c.category_name})</option>`).join("");

      // Default selections: Software Developer vs Data Scientist
      if (careers.length > 2) {
        selA.selectedIndex = 3; // Software Developer
        selB.selectedIndex = 2; // Data Scientist
      }

      updateComparison();
    });

    async function updateComparison() {
      const idA = document.getElementById("careerASelect").value;
      const idB = document.getElementById("careerBSelect").value;

      try {
        const cA = await API.careers.getDetails(idA);
        const cB = await API.careers.getDetails(idB);

        renderCard("cardA", cA);
        renderCard("cardB", cB);
      } catch (err) {
        showToast("Error loading comparison: " + err.message, "error");
      }
    }

    function renderCard(elementId, c) {
      document.getElementById(elementId).innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <span class="badge badge-primary">${c.category_name}</span>
          <span class="badge badge-success">${c.growth_rate}</span>
        </div>
        <h2 class="headline-sm" style="margin-bottom:8px;">${c.title}</h2>
        <p class="body-sm" style="margin-bottom:20px; line-height:1.6;">${c.summary}</p>

        <div style="display:flex; flex-direction:column; gap:16px; border-top:1px solid var(--color-border); padding-top:20px;">
          <div>
            <div class="label-caps">Estimated Salary in INR</div>
            <div style="font-weight:700; color:var(--color-tertiary); margin-top:4px;">${c.avg_salary_inr}</div>
          </div>
          <div>
            <div class="label-caps">Stream Flexibility</div>
            <div class="body-sm" style="margin-top:4px;">${c.stream_flexibility || 'Standard higher secondary foundation'}</div>
          </div>
          <div>
            <div class="label-caps">Required Entrance Exams</div>
            <div style="margin-top:4px; display:flex; flex-direction:column; gap:4px;">
              ${c.requirements.filter(r => r.requirement_type === 'entrance_exam').map(r => `<span class="badge" style="font-size:0.8125rem;">${r.title}</span>`).join('') || '<span class="body-sm">Merit / Direct Admissions</span>'}
            </div>
          </div>
          <div>
            <div class="label-caps">Top Assessed Skills</div>
            <div style="display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;">
              ${c.skills.map(s => `<span class="badge">${s.skill_name}</span>`).join('')}
            </div>
          </div>
          <div>
            <div class="label-caps">Official Regulatory Authority</div>
            <div class="body-sm" style="margin-top:4px;">${c.official_authority_name || 'Statutory Council'}</div>
          </div>
        </div>

        <div style="margin-top:24px;">
          <a href="career-details.html?slug=${c.slug}" class="btn btn-primary btn-sm btn-full">View Detailed Roadmap &rarr;</a>
        </div>
      `;
    }
  </script>
</body>
</html>
