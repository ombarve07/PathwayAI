<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Learning & Courses - PATHWAY AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body style="background-color: var(--color-neutral);">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/logo-badge.png" alt="PATHWAY AI Logo" class="brand-logo-img">
        <span class="brand-name">PATHWAY <span class="brand-ai-badge">AI</span></span>
      </a>

      <nav>
        <ul class="nav-links">
          <li><a href="student-dashboard.html">Overview</a></li>
          <li><a href="my-progress.html">Skill Tracker</a></li>
          <li><a href="roadmap.html">My Roadmap</a></li>
          <li><a href="course-recommendations.html">Courses</a></li>
          <li><a href="my-profile.html">Profile</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button onclick="API.auth.logout()" class="btn btn-outline-dark btn-sm">Sign Out</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 32px; flex-wrap:wrap; gap:16px;">
        <div>
          <span class="label-caps">Skill Development</span>
          <h1 class="headline-lg" style="margin-top: 4px;">My Enrolled Courses</h1>
          <p class="body-md">Keep track of your active and completed skill training modules.</p>
        </div>
        <a href="course-recommendations.html" class="btn btn-primary btn-md">Browse Recommended Courses &rarr;</a>
      </div>

      <div id="learningGrid" class="grid-3" style="gap:24px;"></div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      if (!API.isAuthenticated()) {
        window.location.href = "login.html";
        return;
      }

      try {
        const courses = await API.recommendations.getCourses();
        const container = document.getElementById("learningGrid");

        // Show sample enrolled course
        const activeCourse = courses[0];
        const secondCourse = courses[1];

        container.innerHTML = `
          <div class="card" style="padding:28px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
              <span class="badge badge-primary">${activeCourse.provider_name}</span>
              <span class="badge badge-success">IN PROGRESS (65%)</span>
            </div>
            <h3 class="headline-sm" style="margin-bottom:8px;">${activeCourse.title}</h3>
            <p class="body-sm" style="margin-bottom:16px;">${activeCourse.description}</p>
            <div style="background:#E5E7EB; border-radius:9999px; height:8px; overflow:hidden; margin-bottom:16px;">
              <div style="background:var(--color-primary); width:65%; height:100%;"></div>
            </div>
            <a href="${activeCourse.course_url}" target="_blank" class="btn btn-secondary btn-sm btn-full">Continue Course on SWAYAM ↗</a>
          </div>

          <div class="card" style="padding:28px;">
            <div style="display:flex; justify-content:space-between; margin-bottom:12px;">
              <span class="badge badge-purple">${secondCourse.provider_name}</span>
              <span class="badge badge-primary">READY TO START</span>
            </div>
            <h3 class="headline-sm" style="margin-bottom:8px;">${secondCourse.title}</h3>
            <p class="body-sm" style="margin-bottom:16px;">${secondCourse.description}</p>
            <div style="background:#E5E7EB; border-radius:9999px; height:8px; overflow:hidden; margin-bottom:16px;">
              <div style="background:var(--color-primary); width:15%; height:100%;"></div>
            </div>
            <a href="${secondCourse.course_url}" target="_blank" class="btn btn-secondary btn-sm btn-full">Start Module 1 ↗</a>
          </div>
        `;

      } catch (err) {
        showToast("Error loading courses: " + err.message, "error");
      }
    });
  </script>
</body>
</html>
