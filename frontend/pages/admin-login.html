<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - PATHWAY AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body style="background-color: #111827; color: #F9FAFB;">

  <!-- Simple Header -->
  <header style="padding: 24px 0; border-bottom: 1px solid #374151;">
    <div class="container" style="display:flex; justify-content:space-between; align-items:center;">
      <a href="../index.html" class="brand-logo" style="color:#FFFFFF;">
        <img src="../assets/logo-badge.png" alt="PATHWAY AI Logo" class="brand-logo-img">
        <span class="brand-name">PATHWAY <span class="brand-ai-badge" style="background:linear-gradient(135deg, #6D28D9, #9333EA);">AI</span> <span class="brand-admin-badge">ADMIN</span></span>
      </a>
      <a href="../index.html" class="btn btn-outline-dark btn-sm" style="color:#D1D5DB; border-color:#4B5563;">Back to Site &rarr;</a>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 40px; background:#1F2937; border-color:#374151; color:#F9FAFB;">
        <div style="text-align: center; margin-bottom: 28px;">
          <div class="badge badge-purple" style="margin-bottom:8px;">Restricted Access</div>
          <h1 class="headline-sm" style="color:#FFFFFF; font-size:1.5rem;">Admin Authorization</h1>
          <p class="body-sm" style="color:#9CA3AF; margin-top:4px;">Manage careers, questions, students, and platform revenue.</p>
        </div>

        <form id="adminLoginForm">
          <div class="form-group">
            <label class="form-label" style="color:#E5E7EB;">Admin Email</label>
            <input type="email" id="adminEmail" class="form-control" value="admin@pathway.ai" required style="background:#374151; border-color:#4B5563; color:#FFFFFF;">
          </div>

          <div class="form-group">
            <label class="form-label" style="color:#E5E7EB;">Master Password</label>
            <input type="password" id="adminPassword" class="form-control" value="Admin@12345" required style="background:#374151; border-color:#4B5563; color:#FFFFFF;">
          </div>

          <button type="submit" id="btnAdminLogin" class="btn btn-primary btn-full btn-lg" style="background:#8057E8; border-color:#8057E8; margin-top:12px;">
            Enter Admin Console &rarr;
          </button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnAdminLogin");
      btn.disabled = true;
      btn.textContent = "Verifying Credentials...";

      try {
        const email = document.getElementById("adminEmail").value.trim();
        const pwd = document.getElementById("adminPassword").value;

        const res = await API.auth.login({ email, password: pwd });
        if (!res.is_admin) {
          throw new Error("This account does not have administrative privileges.");
        }

        showToast("Admin credentials authorized.", "success");
        setTimeout(() => {
          window.location.href = "admin-dashboard.html";
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Enter Admin Console →";
        showToast(err.message, "error");
      }
    });
  </script>
</body>
</html>
