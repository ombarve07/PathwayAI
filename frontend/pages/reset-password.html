<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password - PATHWAY AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body style="background-color: var(--color-neutral);">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/logo-badge.png" alt="PATHWAY AI Logo" class="brand-logo-img">
        <span class="brand-name">PATHWAY <span class="brand-ai-badge">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 40px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <h1 class="headline-sm">Set New Password</h1>
          <p class="body-sm" style="margin-top: 4px;">Choose a strong new password for your account.</p>
        </div>

        <form id="resetForm">
          <input type="hidden" id="resetToken">

          <div class="form-group">
            <label class="form-label" for="newPassword">New Password</label>
            <input type="password" id="newPassword" class="form-control" placeholder="••••••••" required minlength="6">
          </div>

          <div class="form-group">
            <label class="form-label" for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-control" placeholder="••••••••" required minlength="6">
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary btn-full btn-lg">Update Password &rarr;</button>
        </form>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const token = urlParams.get("token");
      if (token) {
        document.getElementById("resetToken").value = token;
      } else {
        showToast("Invalid or missing reset token.", "error");
      }

      document.getElementById("resetForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const p1 = document.getElementById("newPassword").value;
        const p2 = document.getElementById("confirmPassword").value;
        const tok = document.getElementById("resetToken").value;

        if (p1 !== p2) {
          showToast("Passwords do not match.", "error");
          return;
        }

        const btn = document.getElementById("submitBtn");
        btn.disabled = true;
        btn.textContent = "Updating...";

        try {
          await API.auth.resetPassword(tok, p1);
          showToast("Password updated successfully! Redirecting to login...", "success");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1000);
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "Update Password →";
          showToast(err.message, "error");
        }
      });
    });
  </script>
</body>
</html>
