<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - PATHWAY AI</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="icon" type="image/png" href="../assets/favicon.png">
</head>
<body style="background-color: var(--color-neutral);">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo">
        <img src="../assets/logo-badge.png" alt="PATHWAY AI Logo" class="brand-logo-img">
        <span class="brand-name">PATHWAY <span class="brand-ai-badge">AI</span></span>
      </a>
      <div class="nav-actions">
        <a href="login.html" class="btn btn-secondary btn-sm">Return to Login</a>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 440px;">
      <div class="card" style="padding: 40px;">
        <div style="text-align: center; margin-bottom: 24px;">
          <h1 class="headline-sm">Reset Password</h1>
          <p class="body-sm" style="margin-top: 4px;">Enter your registered email to receive recovery instructions.</p>
        </div>

        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-primary btn-full btn-lg">Send Reset Instructions &rarr;</button>
        </form>

        <div id="resetResult" style="display:none; margin-top:20px; background:#F0FDF4; border:1px solid #BBF7D0; border-radius:var(--radius-sm); padding:16px;">
          <div style="font-weight:600; color:#166534; font-size:0.875rem;">Password Reset Token Generated</div>
          <p class="body-sm" style="color:#15803D; margin-top:4px;">In this demo environment, click below to proceed directly to resetting your password:</p>
          <a id="resetLink" href="#" class="btn btn-primary btn-sm btn-full" style="margin-top:12px;">Reset Password Now &rarr;</a>
        </div>
      </div>
    </div>
  </main>

  <script src="../js/api.js"></script>
  <script src="../js/main.js"></script>
  <script>
    document.getElementById("forgotForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Processing...";

      try {
        const res = await API.auth.forgotPassword(email);
        showToast("Instructions prepared.", "success");
        if (res.reset_token) {
          document.getElementById("resetResult").style.display = "block";
          document.getElementById("resetLink").href = `reset-password.html?token=${res.reset_token}`;
        }
      } catch (err) {
        showToast(err.message, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send Reset Instructions →";
      }
    });
  </script>
</body>
</html>
